name: fetch-catalogs

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch wikitext
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          pages = {
              "jp": ("ja", "道路標識"),
              "jp_list": ("ja", "日本の道路標識"),
              "jp_en": ("en", "Road signs in Japan"),
              "de": ("de", "Bildtafel der Verkehrszeichen in der Bundesrepublik Deutschland"),
              "fr": ("fr", "Panneaux de signalisation routière en France"),
              "ru": ("ru", "Дорожные знаки России"),
              "gb": ("en", "Road signs in the United Kingdom"),
              "au": ("en", "Road signs in Australia"),
              "ee": ("en", "Road signs in Estonia"),
              "br": ("en", "Road signs in Brazil"),
              "se": ("en", "Road signs in Sweden"),
              "nl": ("en", "Road signs in the Netherlands"),
              "hu": ("en", "Road signs in Hungary"),
              "dk": ("en", "Road signs in Denmark"),
              "fi": ("en", "Road signs in Finland"),
              "sk": ("en", "Road signs in Slovakia"),
              "za": ("en", "Road signs in South Africa"),
              "it": ("en", "Road signs in Italy"),
              "pl": ("en", "Road signs in Poland"),
              "lv": ("en", "Road signs in Latvia"),
              "mk": ("en", "Road signs in North Macedonia"),
              "lt": ("en", "Road signs in Lithuania"),
              "lu": ("en", "Road signs in Luxembourg"),
              "lu_fr": ("fr", "Panneaux de signalisation routière au Luxembourg"),
              "lu_de": ("de", "Bildtafel der Verkehrszeichen in Luxemburg"),
              "et": ("et", "Liiklusmärgid"),
              "et_list": ("et", "Eesti liiklusmärgid"),
              "et_sign": ("et", "Liiklusmärk"),
          }

          def fetch(lang, title):
              url = "https://%s.wikipedia.org/w/api.php?" % lang + urllib.parse.urlencode({
                  "action": "parse", "page": title, "prop": "wikitext",
                  "format": "json", "formatversion": "2", "redirects": "1",
              })
              req = urllib.request.Request(url, headers={"User-Agent": "RoadSignLibrary/1.0"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.load(r)["parse"]["wikitext"]
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and attempt < 3:
                          time.sleep(15 * (attempt + 1))
                          continue
                      raise

          os.makedirs("catalogs", exist_ok=True)
          for key, (lang, title) in pages.items():
              try:
                  text = fetch(lang, title)
                  with open("catalogs/%s.txt" % key, "w", encoding="utf-8") as f:
                      f.write(text)
                  print(key, len(text))
              except Exception as e:
                  print(key, "ERR", type(e).__name__, e)
              time.sleep(3)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-catalogs
          path: catalogs
          retention-days: 7
          if-no-files-found: warn
