name: fetch-page

on:
  workflow_dispatch:
    inputs:
      lang:
        description: 语言代码，如 fr / de / lb
        required: true
        default: en
      page:
        description: 页面标题
        required: true
        default: Road signs in Luxembourg
      key:
        description: 产物文件名（不含 .txt）
        required: true
        default: lu

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch wikitext
        env:
          LANG_CODE: ${{ inputs.lang }}
          PAGE: ${{ inputs.page }}
          KEY: ${{ inputs.key }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request

          lang = os.environ["LANG_CODE"]
          title = os.environ["PAGE"]
          key = os.environ["KEY"]

          url = "https://%s.wikipedia.org/w/api.php?" % lang + urllib.parse.urlencode({
              "action": "parse", "page": title, "prop": "wikitext",
              "format": "json", "formatversion": "2", "redirects": "1",
          })
          req = urllib.request.Request(url, headers={"User-Agent": "RoadSignLibrary/1.0"})
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      text = json.load(r)["parse"]["wikitext"]
                  break
              except urllib.error.HTTPError as e:
                  if e.code == 429 and attempt < 3:
                      time.sleep(15 * (attempt + 1))
                      continue
                  raise

          os.makedirs("catalogs", exist_ok=True)
          with open("catalogs/%s.txt" % key, "w", encoding="utf-8") as f:
              f.write(text)
          print(key, len(text))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: sign-page
          path: catalogs
          retention-days: 7
